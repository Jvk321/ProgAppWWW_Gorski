<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="./css/style.css" rel="stylesheet">
        <title>Kontakt</title>
    </head>
    <body>
        <header>
            <nav>
                <img src="./img/logo/chwila_logo_glowne.svg" alt="logo firmy chwila" width="300px">
               <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="kontakt.html" aria-current="page">Kontakt</a></li>
                <li><a href="produkt.html">Produkt</a></li>
               </ul>
            </nav>
        </header>
        <main>
            <h1>Kontakt</h1>
            <form action="kontakt.html" method="get">
                <div>
                    <label for="email">e-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="produkt">Produkt</label>
                    <select name="produkt" id="produkt" required>
                        <option value="">-- Wybierz produkt --</option>
                        <option value="p1">Lampka nocna led</option>
                        <option value="p2">Wazon ceramiczny</option>
                        <option value="p3">Świeca zapachowa</option>
                    </select>
                </div>
                <div>
                    <label for="ilosc">Liczba sztuk</label>
                    <input type="number" id="ilosc" name="ilosc" required min="1" max="5" step="1">
                </div>
                <div>
                    <label for="wiadomosc">wiadomość:</label>
                    <textarea name="wiadomosc" id="wiadomosc" required minlength="10" maxlength="500"></textarea>
                </div>
                <button type="submit">Sprawdź zapytanie</button>
            </form>
            <p>Formularz demonstracyjny. Dane pojawią się w adresie strony; zapytanie nie
                zostanie zapisane ani wysłane e-mailem.
            </p>
        </main>
        <footer>
            <div class="top-footer">
                <h3>Kontakt</h3>
                <p>kontakt@chwila.com</p>
                <p>+48 123 456 789</p>
                <p>Olsztyn, Polsks</p>
            </div>
            <div class="bottom-footer">
                <p>&copy; 2026 Chwila. Wszelkie prawa zastrzeżone.</p>
            </div>
        </footer>
    </body>
</html>
